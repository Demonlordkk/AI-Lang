[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lang"
version = "2.0.0"
description = "AI-Lang: a concise, general-purpose programming language with a static checker, bytecode VM, and toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["programming-language", "compiler", "interpreter", "vm"]

[project.scripts]
ailang = "ailang.cli:main"

[tool.setuptools]
packages = ["ailang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
